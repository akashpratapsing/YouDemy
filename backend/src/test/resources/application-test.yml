spring:
  datasource:
    url: jdbc:h2:mem:youdemy;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  jwt:
    secret: test-secret-key-for-youdemy-tests-that-is-long-enough-123456
    access-token-minutes: 60
  youtube:
    api-key: test-key

logging:
  level:
    root: WARN
    com.youdemy: WARN
