services:
  postgres:
    image: postgres:16-alpine
    container_name: youdemy-postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-youdemy}
      POSTGRES_USER: ${DATABASE_USERNAME:-youdemy}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-youdemy} -d ${DATABASE_NAME:-youdemy}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: youdemy-redis
    ports:
      - "6379:6379"
    profiles: ["cache"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: youdemy-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:-youdemy}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-youdemy}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-change-me}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
    container_name: youdemy-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres-data:
